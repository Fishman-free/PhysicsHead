[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physicshead"
version = "0.1.0"
description = "A compact auxiliary head for visible-support and image-plane motion proxies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "PhysicsHead Authors" }]
dependencies = ["torch>=2.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Fishman-free/PhysicsHead"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
